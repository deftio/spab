name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Node version
        run: node --version
      # spab has ZERO runtime dependencies — nothing to install.
      - name: Syntax check
        run: |
          for f in src/js/spab.js src/js/cli.js cli/spabdemo.js tests/roundtrip.test.js \
                   tests/branches.test.js tests/fuzz.test.js tests/coverage.js tests/lint.js \
                   r_and_d/harness.js r_and_d/corruptions.js r_and_d/corpus-gen.js \
                   r_and_d/corpus-fs.js r_and_d/payloads.js r_and_d/provenance.js \
                   r_and_d/symbol-survival.js r_and_d/db.js; do
            node --check "$f"
          done
      - name: Lint (warnings are errors)
        run: node tests/lint.js
      - name: Conformance tests
        run: node tests/roundtrip.test.js
      - name: Branch tests
        run: node tests/branches.test.js
      - name: Harness smoke
        run: node r_and_d/harness.js --gen 500 --no-log
      - name: Symbol-survival smoke
        run: node r_and_d/symbol-survival.js --gen 500

      # --- hygiene, MEASURED but NOT gating yet (flip to blocking later) ---
      # Fuzzing and 100% branch coverage are enforced by intent, not by CI failure,
      # until they've proven stable across the matrix. Remove continue-on-error (and
      # use `npm run coverage:strict`) to make them required.
      - name: Fuzz (report only)
        continue-on-error: true
        run: node tests/fuzz.test.js --iterations 3000
      - name: Coverage (report only)
        continue-on-error: true
        run: node tests/coverage.js

  # A conversation identifier in a commit message is permanent once pushed: the
  # commit object stays fetchable by SHA, the PR timeline keeps the record, and a
  # revert adds a commit rather than removing one. tools/release.js checks this
  # before pushing; this is the backstop for commits that arrive any other way.
  commit-hygiene:
    name: commit hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the PR's commits, not just the merge head
      - name: No session/conversation identifiers in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for sha in $(git log --format=%H "$BASE..$HEAD"); do
            msg="$(git log -1 --format=%B "$sha")"
            if printf '%s' "$msg" | grep -Eiq 'claude[-_ ]?session|claude\.ai/code/session|chatgpt\.com/(c|share)/'; then
              echo "::error::$sha contains a conversation identifier in its commit message"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "These are permanent once pushed. Amend or rebase them out before merging."
            exit 1
          fi
          echo "commit messages clean"

  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      # All THREE version surfaces, not two. release.yml and release-on-bump.yml
      # both check the root package.json as well, but only after the merge — so a
      # PR that bumped src/js and forgot the root used to pass every required
      # check, land on main, and only then fail at release time with main already
      # inconsistent. Checking the same three here makes the PR the place it fails.
      - name: version surfaces agree (spab.js, src/js/package.json, package.json)
        run: |
          node -e '
            const spab = require("./src/js/spab.js");
            const pkg  = require("./src/js/package.json");
            const root = require("./package.json");
            const all = {
              "src/js/spab.js VERSION": spab.VERSION,
              "src/js/package.json":    pkg.version,
              "package.json":           root.version
            };
            const values = Object.values(all);
            if (new Set(values).size !== 1) {
              console.error("version mismatch:");
              for (const [k, v] of Object.entries(all)) console.error("  " + k + " = " + v);
              process.exit(1);
            }
            console.log("version ok: " + spab.VERSION + " (all three agree)");
          '
