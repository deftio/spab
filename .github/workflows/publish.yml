name: Publish

# Package publishing. Runs when a GitHub Release is published (release-on-bump.yml
# creates it), or manually from the Actions tab.
#
# npm publishes with NO SECRET. It uses OIDC trusted publishing: GitHub mints a
# short-lived identity token for this workflow, npm verifies it against the trusted
# publisher registered on the package (repo deftio/spab, workflow publish.yml), and
# the upload carries a provenance attestation tying the tarball to this commit and
# run. Nothing to rotate, nothing to leak. Renaming or moving this file breaks the
# match and publishing will fail until the trusted publisher is updated.
#
# PyPI is still token-gated and inert until PYPI_TOKEN exists and the port is real.

on:
  release:
    types: [published]
  workflow_dispatch: {}   # allow manual dry-runs from the Actions tab

jobs:
  npm:
    name: npm (@deftio/spab)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # the OIDC token IS the credential — no secret needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Pack check
        working-directory: src/js
        run: npm pack --dry-run

      # Publishing the same version twice is a hard error, and a re-run of a release
      # (or a manual dispatch after a successful publish) would otherwise fail the
      # whole workflow for no reason. Check first and skip if it is already up.
      - name: Is this version already on npm?
        id: check
        working-directory: src/js
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is already published — nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is not on npm yet."
          fi

      # `npx npm@latest` on purpose: OIDC trusted publishing needs a newer npm than
      # the runner ships, and silently falling back to an old npm would try to read a
      # token that does not exist.
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.check.outputs.published == 'false'
        working-directory: src/js
        run: npx -y npm@latest publish --provenance --access public

  pypi:
    name: PyPI (spab)
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Package-check only while the Python port is a skeleton; guarded so it can't
      # fail the release. Becomes a real build+publish once src/python is implemented.
      - name: Build check
        continue-on-error: true
        working-directory: src/python
        run: |
          python -m pip install --upgrade build >/dev/null
          python -m build || echo "python port not buildable yet (skeleton) — skipping"

      - name: Publish to PyPI
        if: ${{ env.PYPI_TOKEN != '' }}
        working-directory: src/python
        run: |
          python -m pip install --upgrade twine >/dev/null
          twine upload -u __token__ -p "$PYPI_TOKEN" dist/* || echo "nothing to upload yet"

      - name: Note (no token)
        if: ${{ env.PYPI_TOKEN == '' }}
        run: echo "PYPI_TOKEN not set — no publish. Add the secret once the Python port is ready."
