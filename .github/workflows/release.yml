name: Release

# "gh versions as part of push": pushing a semver tag (v0.4.0) cuts a GitHub
# Release. The tag must match the source version, and the full test suite must
# pass, before the release is created — a tag alone can't ship a broken build.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # only this job may create releases/tags

jobs:
  verify:
    name: verify tag == version, tests green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Tag matches source version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e '
            const spab = require("./src/js/spab.js");
            const pkg  = require("./src/js/package.json");
            const root = require("./package.json");
            const tag  = process.env.TAG;
            const all  = { "spab.js": spab.VERSION, "src/js/package.json": pkg.version, "package.json": root.version };
            let bad = false;
            for (const [k, v] of Object.entries(all)) {
              if (v !== tag) { console.error(`mismatch: tag ${tag} != ${k} ${v}`); bad = true; }
            }
            if (bad) process.exit(1);
            console.log("tag matches all versions: " + tag);
          '
        env:
          TAG: ${{ github.ref_name }}

      # ZERO dependencies — nothing to install.
      - name: Conformance tests
        run: node tests/roundtrip.test.js

  release:
    name: create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section for this tag
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # pull the [x.y.z] block out of CHANGELOG.md; fall back to a generic line
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $VER. See CHANGELOG.md for details." > RELEASE_NOTES.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "spab $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
