<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spab — robust text watermarking</title>
<script src="https://cdn.jsdelivr.net/npm/bitwrench@2/dist/bitwrench.umd.min.js"></script>
<script src="../src/js/spab.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";

  var styles = bw.loadStyles({ primary: '#3b6ea5', secondary: '#c9633b', radius: 'lg', elevation: 'sm', spacing: 'normal' });
  var p = styles.palette, L = styles.layout;

  // ---- site styling (wide container + hero + prose + carrier viz) ----
  bw.injectCSS(bw.css({
    'body': { background: p.background || '#fff', color: p.dark.base, margin: '0' },
    '.wrap': { maxWidth: '1180px', margin: '0 auto', padding: '0 28px' },
    '.nav': { borderBottom: '1px solid ' + p.light.border, background: p.surface, position: 'sticky', top: '0', zIndex: '10' },
    '.nav .wrap': { display: 'flex', alignItems: 'center', gap: '8px', height: '58px' },
    '.brand': { fontWeight: '800', fontSize: '20px', color: p.primary.base, textDecoration: 'none', marginRight: 'auto', letterSpacing: '-.01em' },
    '.navlink': { color: p.dark.base, textDecoration: 'none', padding: '8px 12px', borderRadius: '8px', fontSize: '14px' },
    '.navlink:hover': { background: p.primary.light },
    '.navlink.active': { color: p.primary.base, fontWeight: '700' },
    '.hero': { background: 'linear-gradient(135deg,' + p.primary.base + ',' + p.secondary.base + ')', color: '#fff', padding: '64px 0 56px' },
    '.hero h1': { fontSize: '44px', margin: '0 0 10px', letterSpacing: '-.02em', lineHeight: '1.05' },
    '.hero p': { fontSize: '19px', opacity: '.94', maxWidth: '660px', margin: '0 0 24px' },
    '.hero .btns a': { display: 'inline-block', textDecoration: 'none', padding: '12px 22px', borderRadius: '10px', fontWeight: '700', marginRight: '12px' },
    '.btn-solid': { background: '#fff', color: p.primary.base },
    '.btn-ghost': { border: '1.5px solid rgba(255,255,255,.7)', color: '#fff' },
    '.section': { padding: '44px 0' },
    '.section h2': { fontSize: '27px', margin: '0 0 6px', letterSpacing: '-.01em' },
    '.lede': { color: p.dark.base, opacity: '.72', fontSize: '17px', maxWidth: '720px', marginTop: '0' },
    '.prose': { fontSize: '16px', lineHeight: '1.7', maxWidth: '760px' },
    '.prose code': { background: p.surface, border: '1px solid ' + p.light.border, borderRadius: '5px', padding: '1px 6px', fontSize: '14px' },
    '.grid3': { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '18px' },
    '.grid2': { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '18px' },
    '.intgrid': { display: 'grid', gridTemplateColumns: '260px 1fr', gap: '24px', alignItems: 'start' },
    '@media (max-width: 820px)': { '.grid3': { gridTemplateColumns: '1fr' }, '.grid2': { gridTemplateColumns: '1fr' }, '.intgrid': { gridTemplateColumns: '1fr' }, '.hero h1': { fontSize: '34px' } },
    'table.t': { width: '100%', borderCollapse: 'collapse', fontSize: '14px', margin: '10px 0' },
    'table.t th, table.t td': { textAlign: 'left', padding: '8px 10px', borderBottom: '1px solid ' + p.light.border },
    'table.t th': { color: p.dark.base, opacity: '.65', fontWeight: '600', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '.04em' },
    'pre.code': { background: p.dark.base, color: '#e7edf3', padding: '14px 16px', borderRadius: '10px', overflowX: 'auto', fontSize: '13px', lineHeight: '1.55' },
    '.foot': { borderTop: '1px solid ' + p.light.border, color: p.dark.base, opacity: '.6', fontSize: '13px', padding: '26px 0', marginTop: '20px' },
    // carrier visualization (test page)
    '.spab-view': { fontFamily: 'ui-monospace,SFMono-Regular,Menlo,monospace', fontSize: '13px', lineHeight: '2', background: p.surface, border: '1px solid ' + p.light.border, borderRadius: L.radius.card, padding: L.spacing.card, whiteSpace: 'pre-wrap', wordBreak: 'break-word', maxHeight: '230px', overflow: 'auto' },
    '.slot': { display: 'inline-block', minWidth: '13px', height: '15px', lineHeight: '15px', textAlign: 'center', borderRadius: '3px', color: '#fff', fontSize: '10px', verticalAlign: 'middle', margin: '0 1px' },
    '.v0': { background: '#9aa4b0' }, '.v1': { background: '#4a86c8' }, '.v2': { background: '#3fa564' }, '.v3': { background: '#d98a3d' },
    '.pmark': { background: p.secondary.base, color: '#fff', borderRadius: '3px', padding: '0 2px' },
    '.metawrap': { display: 'flex', flexWrap: 'wrap', gap: '8px', alignItems: 'center' },
    '.chipwrap': { display: 'flex', flexWrap: 'wrap', gap: '8px' }
  }));

  // ================= shared helpers =================
  function tt(headers, rows) {
    return { t: 'table', a: { class: 't' }, c: [
      { t: 'thead', c: { t: 'tr', c: headers.map(function (h) { return { t: 'th', c: h }; }) } },
      { t: 'tbody', c: rows.map(function (r) { return { t: 'tr', c: r.map(function (cell) { return { t: 'td', c: cell }; }) }; }) }
    ] };
  }
  function badge(text, v) { return { t: 'span', a: { class: 'bw_badge ' + (v || '') }, c: text }; }

  // ================= TEST PAGE (the playground) =================
  var SAMPLE = "It's a well-known, old-fashioned truth that the co-operative fox-trot isn't easily forgotten. " +
    "\"Keep the spacing,\" she said, \"and the punctuation too.\" The long-standing custom, quietly kept, " +
    "travels wherever the text is copied, from letter to letter and line to line, through many a re-reading. ".repeat(3);
  var WSV = [0x2006, 0x2009, 0x200A];
  var st = { cover: SAMPLE, msg: 'spab-2026', cls: { ws: true, apos: true, hyphen: true }, ecc: 'repetition', showCarriers: true, wm: null, params: null, active: {} };
  function R() { return Math.random(); }
  var A = {
    normalize:   { label: 'normalize', p: 0.3, fn: function (t, p) { return t.split('').map(function (ch) { var c = ch.charCodeAt(0); return (WSV.indexOf(c) >= 0 && R() < p) ? ' ' : ch; }).join(''); } },
    nfkc:        { label: 'NFKC', fn: function (t) { return t.normalize('NFKC'); } },
    smartQuotes: { label: 'smart-quotes', fn: function (t) { return t.replace(/'/g, String.fromCharCode(0x2019)); } },
    saltPepper:  { label: 'salt & pepper', p: 0.15, fn: function (t, p) { var V = [0x20].concat(WSV); return t.split('').map(function (ch) { var c = ch.charCodeAt(0); return (WSV.indexOf(c) >= 0 && R() < p) ? String.fromCharCode(V[(R() * 4) | 0]) : ch; }).join(''); } },
    fullStrip:   { label: 'strip whitespace', fn: function (t) { return t.replace(new RegExp('[' + WSV.map(function (c) { return '\\u' + c.toString(16).padStart(4, '0'); }).join('') + ']', 'g'), ' '); } },
    cutPaste:    { label: 'cut / paste', p: 0.5, fn: function (t, p) { var span = Math.floor(t.length * p), s = Math.floor(R() * Math.max(1, t.length - span)); return t.slice(s, s + span); } },
    truncate:    { label: 'truncate', p: 0.5, fn: function (t, p) { return t.slice(0, Math.max(1, Math.floor(t.length * p))); } },
    wordDelete:  { label: 'word delete', p: 0.1, fn: function (t, p) { return t.split(/(\s+)/).filter(function (_, i) { return i % 2 === 1 || R() >= p; }).join(''); } }
  };
  function params() { var c = []; if (st.cls.ws) c.push('ws'); if (st.cls.apos) c.push('apos'); if (st.cls.hyphen) c.push('hyphen'); return { classes: c.length ? c : ['ws'], ecc: st.ecc }; }
  function applyAttacks(text) { Object.keys(A).forEach(function (k) { if (st.active[k]) text = A[k].fn(text, A[k].p); }); return text; }
  function statusVariant(s) { return s === 'perfect' ? 'bw_success' : s === 'corrected' ? 'bw_warning' : 'bw_danger'; }
  function markerHTML(text) {
    if (!st.showCarriers) return bw.escapeHTML(text);
    var ids = SPAB.resolveClasses(params()), mark = {};
    if (ids.indexOf('ws') >= 0) { var map = {}; SPAB.SPACE_MAP.forEach(function (c, i) { map[c] = i; }); SPAB.getSlots(text).forEach(function (i) { var v = map[text[i]]; if (v !== undefined) mark[i] = { t: 'ws', v: v }; }); }
    var pc = []; if (ids.indexOf('apos') >= 0) pc.push(0x27, 0x2019); if (ids.indexOf('hyphen') >= 0) pc.push(0x2d, 0x2010);
    for (var i = 0; i < text.length; i++) if (pc.indexOf(text.charCodeAt(i)) >= 0 && !mark[i]) mark[i] = { t: 'p' };
    var out = '';
    for (i = 0; i < text.length; i++) {
      if (mark[i] && mark[i].t === 'ws') out += '<span class="slot v' + mark[i].v + '">' + mark[i].v + '</span>';
      else if (mark[i]) out += '<span class="pmark">' + bw.escapeHTML(text[i]) + '</span>';
      else if (text[i] === '\n') out += '<br>';
      else out += bw.escapeHTML(text[i]);
    }
    return out;
  }
  function updateMeta(md) {
    var chans = md.channels || {}, chStr = Object.keys(chans).map(function (id) { return id + ':' + chans[id].sites; }).join(' ');
    var items = [badge('ecc ' + md.ecc), badge('classes ' + (md.classes || []).join('+')), badge('sites ' + chStr), badge((md.ecc === 'rlnc' ? 'packets ' : 'copies ') + md.reps), badge('payload ' + md.payloadBytes + 'B')];
    if (md.issues && md.issues.length) items.push(badge(md.issues.join(' '), 'bw_warning'));
    bw.DOM('#encMeta', { t: 'div', a: { class: 'metawrap' }, c: items });
  }
  function updateMarker() { bw.DOM('#markerView', { t: 'div', a: { class: 'spab-view' }, c: bw.raw(markerHTML(st.wm)) }); }
  function runDecode() {
    var d = SPAB.decode(applyAttacks(st.wm), st.params), md = d.metadata, match = d.message !== null && d.message === st.msg;
    var items = [badge(md.status.toUpperCase(), statusVariant(md.status)),
      { t: 'span', a: { class: 'bw_badge', style: bw.s({ fontFamily: 'ui-monospace,Menlo,monospace' }) }, c: d.message === null ? '—' : d.message },
      badge('match ' + (match ? '✓' : '✗')), badge('confidence ' + Math.round((md.confidence || 0) * 100) + '%')];
    if (md.channel) items.push(badge('via ' + md.channel));
    if (md.packets !== undefined) items.push(badge('packets ' + md.packets));
    bw.DOM('#decResult', { t: 'div', a: { class: 'metawrap' }, c: items });
  }
  function renderAttacks() {
    bw.DOM('#attackRow', { t: 'div', a: { class: 'chipwrap' }, c: Object.keys(A).map(function (k) {
      return bw.makeButton({ text: A[k].label, size: 'sm', variant: st.active[k] ? 'secondary' : 'light', onclick: function () { st.active[k] = !st.active[k]; renderAttacks(); renderSliders(); runDecode(); } });
    }) });
  }
  function renderSliders() {
    var rows = Object.keys(A).filter(function (k) { return A[k].p !== undefined && st.active[k]; }).map(function (k) {
      return { t: 'div', a: { style: bw.s({ display: 'flex', alignItems: 'center', gap: '10px', marginTop: '8px' }) }, c: [
        { t: 'label', a: { style: bw.s({ minWidth: '130px', color: p.dark.base, fontSize: '13px' }) }, c: A[k].label },
        { t: 'input', a: { type: 'range', min: '0', max: '100', value: String(Math.round(A[k].p * 100)), style: bw.s({ flex: '1' }), oninput: function (e) { A[k].p = (+e.target.value) / 100; runDecode(); } } }
      ] };
    });
    bw.DOM('#sliderRow', { t: 'div', c: rows });
  }
  function doEncode() { st.params = params(); var res = SPAB.encode(st.cover, st.msg, st.params); st.wm = res.text; updateMeta(res.metadata); updateMarker(); runDecode(); }
  function initTest() { renderAttacks(); doEncode(); }

  function checkbox(label, checked, onchange) {
    return { t: 'label', a: { style: bw.s({ display: 'inline-flex', alignItems: 'center', gap: '6px', marginRight: '14px', cursor: 'pointer' }) }, c: [{ t: 'input', a: { type: 'checkbox', checked: checked, onchange: onchange } }, label] };
  }
  function field(label, control) { return { t: 'div', a: { style: bw.s({ marginBottom: '10px' }) }, c: [{ t: 'label', a: { style: bw.s({ fontSize: '12px', color: p.dark.base, opacity: '.65' }) }, c: label }, control] }; }

  function testView() {
    return { t: 'div', a: { class: 'wrap section', id: 'testroot' }, o: { mounted: function () { setTimeout(initTest, 0); } }, c: [
      { t: 'h2', c: 'Live playground' },
      { t: 'p', a: { class: 'lede' }, c: 'Encode a message, choose carriers and ECC, then attack the text and watch it decode. Runs the real library in your browser.' },
      { t: 'div', a: { class: 'grid2', style: bw.s({ marginTop: '18px' }) }, c: [
        bw.makeCard({ title: '1 · Encode', content: { t: 'div', c: [
          field('Cover text', { t: 'textarea', a: { class: 'bw_form_control', rows: 6, oninput: function (e) { st.cover = e.target.value; } }, c: st.cover }),
          field('Message', { t: 'input', a: { class: 'bw_form_control', type: 'text', value: st.msg, oninput: function (e) { st.msg = e.target.value; } } }),
          { t: 'div', a: { style: bw.s({ display: 'flex', gap: '18px', flexWrap: 'wrap', alignItems: 'flex-end' }) }, c: [
            field('Carrier classes', { t: 'div', c: [
              checkbox('whitespace', st.cls.ws, function (e) { st.cls.ws = e.target.checked; doEncode(); }),
              checkbox('apostrophe', st.cls.apos, function (e) { st.cls.apos = e.target.checked; doEncode(); }),
              checkbox('hyphen', st.cls.hyphen, function (e) { st.cls.hyphen = e.target.checked; doEncode(); })
            ] }),
            field('ECC', { t: 'select', a: { class: 'bw_form_control', style: bw.s({ width: 'auto' }), onchange: function (e) { st.ecc = e.target.value; doEncode(); } }, c: [{ t: 'option', a: { value: 'repetition' }, c: 'repetition' }, { t: 'option', a: { value: 'rlnc' }, c: 'RLNC fountain' }] })
          ] },
          { t: 'div', a: { style: bw.s({ marginTop: '8px' }) }, c: bw.makeButton({ text: 'Encode ▶', variant: 'primary', onclick: doEncode }) },
          { t: 'div', a: { id: 'encMeta', style: bw.s({ marginTop: '14px' }) } }
        ] } }),
        bw.makeCard({ title: '2 · Watermarked text', content: { t: 'div', c: [
          checkbox('show carriers', st.showCarriers, function (e) { st.showCarriers = e.target.checked; updateMarker(); }),
          { t: 'div', a: { id: 'markerView', style: bw.s({ marginTop: '8px' }) } },
          { t: 'div', a: { style: bw.s({ marginTop: '10px' }) }, c: bw.makeButton({ text: 'Copy', variant: 'outline-secondary', size: 'sm', onclick: function () { if (st.wm && navigator.clipboard) navigator.clipboard.writeText(st.wm); } }) }
        ] } })
      ] },
      bw.makeCard({ title: '3 · Channel attacks', content: { t: 'div', c: [
        { t: 'p', a: { style: bw.s({ opacity: '.7', fontSize: '13px', marginTop: '0' }) }, c: 'Applied before decoding. Click to toggle; sliders set intensity.' },
        { t: 'div', a: { id: 'attackRow' } }, { t: 'div', a: { id: 'sliderRow' } }
      ] } }),
      bw.makeCard({ title: '4 · Decode', content: { t: 'div', a: { id: 'decResult' } } })
    ] };
  }

  // ================= HOME =================
  function feature(title, body) { return bw.makeCard({ title: title, content: { t: 'p', a: { class: 'prose', style: bw.s({ margin: '0' }) }, c: body } }); }
  function homeView() {
    return { t: 'div', c: [
      { t: 'div', a: { class: 'hero' }, c: { t: 'div', a: { class: 'wrap' }, c: [
        { t: 'h1', c: 'Hide a message in the whitespace of text.' },
        { t: 'p', c: 'spab is a small, dependency-free library that embeds an arbitrary payload — a serial, a hash, JSON, even a tiny program — into the spaces and punctuation of ordinary text, protected by error correction so it survives copy/paste, reformatting, and normalization. The text reads identically; the signal lives in choices a reader never notices.' },
        { t: 'div', a: { class: 'btns' }, c: [
          { t: 'a', a: { href: '#/test', class: 'btn-solid' }, c: 'Try the live demo →' },
          { t: 'a', a: { href: '#/how', class: 'btn-ghost' }, c: 'How it works' }
        ] }
      ] } },
      { t: 'div', a: { class: 'wrap section' }, c: [
        { t: 'div', a: { class: 'grid3' }, c: [
          feature('Robust, not fragile', 'Multiple carrier channels + error correction. Whitespace and confusables fail on different edits, so the payload survives when one channel is wiped.'),
          feature('Invisible where it counts', 'Renders identically in browsers, docs, chat, and PDFs. The mark is which space or which quote — not what the words say.'),
          feature('Zero dependencies', 'A hand-rolled codec, GF(256) fountain, and framing — no third-party packages. One reference in JavaScript, more language ports on the way.')
        ] },
        { t: 'div', a: { style: bw.s({ marginTop: '34px' }) }, c: [
          { t: 'h2', c: 'The idea in one line' },
          { t: 'p', a: { class: 'prose' }, c: bw.raw('Text carries <b>spare entropy</b> — equivalent choices a reader won\'t notice (which space, which dash, straight vs. curly quote). spab measures that latent capacity, spends some on signal, and keeps enough margin (redundancy + ECC) to survive the channel. It\'s information-entropy management, applied to plain text.') },
          { t: 'div', a: { style: bw.s({ marginTop: '16px' }) }, c: { t: 'a', a: { href: '#/test', class: 'navlink', style: bw.s({ background: p.primary.light, color: p.primary.base, fontWeight: '700', padding: '10px 16px' }) }, c: 'Open the interactive playground →' } }
        ] }
      ] }
    ] };
  }

  // ================= HOW IT WORKS =================
  function howView() {
    return { t: 'div', a: { class: 'wrap section' }, c: [
      { t: 'h2', c: 'How spab works' },
      { t: 'p', a: { class: 'lede' }, c: 'A quick tour of the carriers, the parallel-channel design, error correction, and — honestly — the limits.' },

      { t: 'h3', c: 'Carriers: whitespace + confusables' },
      { t: 'p', a: { class: 'prose' }, c: bw.raw('spab writes bits by substituting characters that look the same but differ in code point. Two classes are on by default, chosen from measurement:') },
      tt(['Carrier', 'Choice (bit 0 / 1)', 'Bits/site', 'Survives NFKC?'], [
        ['whitespace', 'space / thin / hair / six-per-em', '2', bw.raw('<b style="color:#cc4433">no</b> — collapses to a plain space')],
        ['apostrophe', bw.raw("straight <code>'</code> / curly <code>&#8217;</code>"), '1', bw.raw('<b style="color:#2e9e5b">yes</b>')],
        ['hyphen', bw.raw('hyphen-minus / Unicode hyphen'), '1', bw.raw('<b style="color:#2e9e5b">yes</b>')]
      ]),
      { t: 'p', a: { class: 'prose' }, c: bw.raw('The key insight: <b>NFKC normalization</b> (common in databases, forms, and search) erases every whitespace variant, but the confusables survive it — while a "smart-quote" autocorrect erases the apostrophe channel but leaves whitespace. They fail on <i>different</i> channels.') },

      { t: 'h3', c: 'Parallel channels' },
      { t: 'p', a: { class: 'prose' }, c: 'Each carrier is an independent channel that carries the whole payload. Decode returns whichever channel survived — so an edit that kills one leaves the others intact:' },
      tt(['Attack', 'whitespace-only', 'default (multi-carrier)'], [
        ['clean', '✓', bw.raw('✓ <span style="opacity:.6">via whitespace</span>')],
        ['NFKC normalize', bw.raw('<b style="color:#cc4433">FAIL</b>'), bw.raw('✓ <span style="opacity:.6">via apostrophe</span>')],
        ['smart-quote autocorrect', '✓', bw.raw('✓ <span style="opacity:.6">via whitespace</span>')],
        ['strip whitespace', bw.raw('<b style="color:#cc4433">FAIL</b>'), bw.raw('✓ <span style="opacity:.6">via apostrophe</span>')]
      ]),

      { t: 'h3', c: 'Error correction' },
      { t: 'p', a: { class: 'prose' }, c: bw.raw('Two ECC modes. <b>Repetition</b> (default) writes the framed payload many times and majority-votes per bit — strong when a channel is dense. <b>RLNC fountain</b> (a from-scratch GF(256) random-linear code) breaks the payload into self-checking, self-locating packets that <i>pool across all channels</i>, so surviving carriers reconstruct the whole message. Both are dependency-free.') },

      { t: 'h3', c: 'Capacity vs. robustness' },
      { t: 'p', a: { class: 'prose' }, c: bw.raw('More redundancy = more survivable, less payload. A short passage holds a tiny serial ultra-redundantly; a long document holds a hash, JSON, or an easter-egg program. Match payload size to text length, then spend the rest on redundancy.') },

      { t: 'h3', c: 'What it is not' },
      { t: 'div', a: { style: bw.s({ maxWidth: '760px' }) }, c: bw.makeAlert ? bw.makeAlert({ variant: 'warning', content: bw.raw('spab targets <b>incidental</b> robustness — ordinary editing, copy/paste, reformatting. It does <b>not</b> defeat a determined stripper: anyone who knows the carrier set can remove it, and fully rewriting the text removes it entirely. The design raises that cost and makes stripping detectable, but never claims to be unbreakable.') }) : { t: 'p', a: { class: 'prose' }, c: 'spab targets incidental robustness, not defeat of a determined adversary.' } },

      { t: 'div', a: { style: bw.s({ marginTop: '20px' }) }, c: { t: 'a', a: { href: '#/test', class: 'navlink', style: bw.s({ background: p.primary.light, color: p.primary.base, fontWeight: '700', padding: '10px 16px' }) }, c: 'See it live in the playground →' } }
    ] };
  }

  // ================= LIBRARIES / INTEGRATION (long, anchored) =================
  function goTo(id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  function langSection(id, name, status, statusVar, blurb, install, code, notes) {
    return { t: 'section', a: { id: id, style: bw.s({ paddingTop: '18px', scrollMarginTop: '70px' }) }, c: [
      { t: 'div', a: { style: bw.s({ display: 'flex', alignItems: 'center', gap: '12px' }) }, c: [
        { t: 'h3', a: { style: bw.s({ margin: '0' }) }, c: name }, badge(status, statusVar) ] },
      { t: 'p', a: { class: 'prose', style: bw.s({ marginTop: '6px' }) }, c: blurb },
      install ? { t: 'div', c: [{ t: 'div', a: { style: bw.s({ fontSize: '12px', textTransform: 'uppercase', letterSpacing: '.05em', opacity: '.6', margin: '10px 0 4px' }) }, c: 'Install' }, { t: 'pre', a: { class: 'code' }, c: install }] } : null,
      { t: 'div', a: { style: bw.s({ fontSize: '12px', textTransform: 'uppercase', letterSpacing: '.05em', opacity: '.6', margin: '12px 0 4px' }) }, c: 'Encode & decode' },
      { t: 'pre', a: { class: 'code' }, c: code },
      notes ? { t: 'p', a: { class: 'prose', style: bw.s({ fontSize: '14px', opacity: '.85' }) }, c: notes } : null
    ] };
  }
  function librariesView() {

  }
  function shell() {
    bw.DOM('#app', { t: 'div', c: [
      { t: 'div', a: { id: 'nav' } },
      { t: 'div', a: { id: 'view' } },
      { t: 'div', a: { class: 'foot' }, c: { t: 'div', a: { class: 'wrap' }, c: bw.raw('spab — robust text watermarking · zero dependencies · BSD-2-Clause · port <b>1948</b> (Shannon, 1948)') } }
    ] });
  }
  function paint() {
    var path = (location.hash || '#/').replace(/^#/, '') || '/';
    bw.DOM('#nav', navbar(path));
    var view = path === '/how' ? howView() : path === '/test' ? testView() : path === '/libraries' ? librariesView() : homeView();

  shell();
  window.addEventListener('hashchange', paint);
