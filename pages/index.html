<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spab — watermark plain text</title>
<meta name="description" content="spab embeds a payload in the whitespace and punctuation of ordinary text, protected by error correction so it survives copy/paste, reformatting, and normalization.">
<meta name="color-scheme" content="light dark">
<!-- GoatCounter analytics -->
<script data-goatcounter="https://deftio.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bitwrench@2/dist/bitwrench.umd.min.js"></script>
<script src="../src/js/spab.js"></script>
<!-- Measured robustness results, generated by comparisons/run.js --js. Never edited by hand. -->
<script src="./data/robustness.js"></script>
<!-- Shared site chrome: theme, header/nav, footer, router. See pages/site.js. -->
<script src="./site.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";

  // The theme is generated by site.js at load time, so the palette is available
  // here while the view functions below are being defined.
  var p = SPABSite.palette;
  var S = SPABSite.section;

  // ================= shared helpers =================
  function tt(headers, rows) {
    return { t: 'table', a: { class: 't' }, c: [
      { t: 'thead', c: { t: 'tr', c: headers.map(function (h) { return { t: 'th', c: h }; }) } },
      { t: 'tbody', c: rows.map(function (r) { return { t: 'tr', c: r.map(function (cell) { return { t: 'td', c: cell }; }) }; }) }
    ] };
  }
  // Real component rather than a hand-written class: the 1.x-era `bw_badge` class
  // has no rules in bitwrench 2.x (they are BCCL-prefixed), so these used to
  // render as unstyled, run-together text.
  function badge(text, v) {
    return bw.makeBadge({ text: text, variant: (v || 'light').replace(/^bw_/, '') });
  }

  // ================= TEST PAGE (the playground) =================
  var SAMPLE = "It's a well-known, old-fashioned truth that the co-operative fox-trot isn't easily forgotten. " +
    "\"Keep the spacing,\" she said, \"and the punctuation too.\" The long-standing custom, quietly kept, " +
    "travels wherever the text is copied, from letter to letter and line to line, through many a re-reading. ".repeat(3);
  var WSV = [0x2006, 0x2009, 0x200A];
  var ZWV = [0x200B, 0x200C, 0x200D, 0x2060];
  var WSDV = [0x2009, 0x200A, 0x2006, 0x2005, 0x2004, 0x2008, 0x205F];
  var METHODS = {
    sparse:  { label: 'Sparse — whitespace + confusables (length-preserving, default)' },
    wsdense: { label: 'Dense whitespace — 8 space variants (length-preserving)' },
    zwsp:    { label: 'Dense zero-width — inserts invisible chars (StegCloak-style)' }
  };
  var st = { cover: SAMPLE, msg: 'spab-2026', method: 'sparse', cls: { ws: true, apos: true, hyphen: true }, ecc: 'repetition', key: '', autoGrow: false, showCarriers: false, wm: null, params: null, meta: null, active: {} };
  function R() { return Math.random(); }
  var A = {
    normalize:   { label: 'normalize', p: 0.3, fn: function (t, p) { return t.split('').map(function (ch) { var c = ch.charCodeAt(0); return (WSV.indexOf(c) >= 0 && R() < p) ? ' ' : ch; }).join(''); } },
    nfkc:        { label: 'NFKC', fn: function (t) { return t.normalize('NFKC'); } },
    smartQuotes: { label: 'smart-quotes', fn: function (t) { return t.replace(/'/g, String.fromCharCode(0x2019)); } },
    saltPepper:  { label: 'salt & pepper', p: 0.15, fn: function (t, p) { var V = [0x20].concat(WSV); return t.split('').map(function (ch) { var c = ch.charCodeAt(0); return (WSV.indexOf(c) >= 0 && R() < p) ? String.fromCharCode(V[(R() * 4) | 0]) : ch; }).join(''); } },
    fullStrip:   { label: 'strip whitespace', fn: function (t) { return t.replace(new RegExp('[' + WSV.map(function (c) { return '\\u' + c.toString(16).padStart(4, '0'); }).join('') + ']', 'g'), ' '); } },
    cutPaste:    { label: 'cut / paste', p: 0.5, fn: function (t, p) { var span = Math.floor(t.length * p), s = Math.floor(R() * Math.max(1, t.length - span)); return t.slice(s, s + span); } },
    truncate:    { label: 'truncate', p: 0.5, fn: function (t, p) { return t.slice(0, Math.max(1, Math.floor(t.length * p))); } },
    wordDelete:  { label: 'word delete', p: 0.1, fn: function (t, p) { return t.split(/(\s+)/).filter(function (_, i) { return i % 2 === 1 || R() >= p; }).join(''); } }
  };
  function params() {
    var p;
    if (st.method === 'wsdense') p = { classes: ['wsdense'], ecc: st.ecc };
    else if (st.method === 'zwsp') p = { classes: ['zwsp'], ecc: st.ecc };
    else {
      var c = []; if (st.cls.ws) c.push('ws'); if (st.cls.apos) c.push('apos'); if (st.cls.hyphen) c.push('hyphen');
      p = { classes: c.length ? c : ['ws'], ecc: st.ecc };
    }
    // Off by default here, unlike the front page: the Playground is where the
    // trade-off should be visible rather than smoothed over.
    if (st.autoGrow) p.autoGrow = true;
    return p;
  }
  function withKey(p) { if (st.key) p.key = st.key; return p; }
  function applyAttacks(text) { Object.keys(A).forEach(function (k) { if (st.active[k]) text = A[k].fn(text, A[k].p); }); return text; }
  // 'encrypted' means the packet was found and verified but needs a key — that is a
  // successful read, not a failure, so it should not turn the badge red.
  function statusVariant(s) {
    if (s === 'perfect') return 'bw_success';
    if (s === 'corrected' || s === 'encrypted') return 'bw_warning';
    return 'bw_danger';
  }
  // Detectability proxy (learned from StegCloak's "the Warden can count invisibles" +
  // Agarwal's cover/stego similarity): how much the marked text deviates from natural.
  function detectability(text) {
    if (st.method === 'zwsp') {
      var inv = 0; for (var i = 0; i < text.length; i++) if (ZWV.indexOf(text.charCodeAt(i)) >= 0) inv++;
      var pct = text.length ? Math.round(1000 * inv / text.length) / 10 : 0;
      return { pct: pct, label: inv ? 'HIGH' : 'none', variant: inv ? 'bw_danger' : 'bw_success',
        detail: inv + ' zero-width chars (' + pct + '% of length) — trivially found in a hex / show-invisibles view' };
    }
    var variants = st.method === 'wsdense' ? WSDV : WSV;
    var spaces = 0, odd = 0;
    for (var j = 0; j < text.length; j++) { var c = text.charCodeAt(j); if (c === 0x20) spaces++; else if (variants.indexOf(c) >= 0) { spaces++; odd++; } }
    var share = spaces ? Math.round(1000 * odd / spaces) / 10 : 0;
    var lvl = share < 2 ? ['LOW', 'bw_success'] : share < 15 ? ['MEDIUM', 'bw_warning'] : ['HIGH', 'bw_danger'];
    return { pct: share, label: lvl[0], variant: lvl[1],
      detail: 'visually identical; but ' + odd + '/' + spaces + ' spaces are non-standard variants — a whitespace-histogram test flags ' + share + '%' };
  }
  function markerHTML(text) {
    if (!st.showCarriers) return bw.escapeHTML(text);
    var ids = SPAB.resolveClasses(params());
    var wsMap = {}; SPAB.SPACE_MAP.forEach(function (c, i) { wsMap[c] = i; });
    var out = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text[i], code = text.charCodeAt(i);
      if (ids.indexOf('ws') >= 0 && wsMap[ch] !== undefined) { out += '<span class="slot v' + wsMap[ch] + '">' + wsMap[ch] + '</span>'; continue; }
      if (ids.indexOf('wsdense') >= 0 && (code === 0x20 || WSDV.indexOf(code) >= 0)) { var v = code === 0x20 ? 0 : WSDV.indexOf(code) + 1; out += '<span class="slot v' + (v % 4) + '">' + v + '</span>'; continue; }
      if (ids.indexOf('zwsp') >= 0 && ZWV.indexOf(code) >= 0) { out += '<span class="pmark">' + ZWV.indexOf(code) + '</span>'; continue; }
      if ((ids.indexOf('apos') >= 0 && (code === 0x27 || code === 0x2019)) || (ids.indexOf('hyphen') >= 0 && (code === 0x2d || code === 0x2010))) { out += '<span class="pmark">' + bw.escapeHTML(ch) + '</span>'; continue; }
      if (ch === '\n') out += '<br>'; else out += bw.escapeHTML(ch);
    }
    return out;
  }
  // compact summary badges (always visible)
  function updateMeta(md) {
    var items = [badge('method ' + st.method), badge('ecc ' + md.ecc), badge('carriers ' + (md.classes || []).join('+')),
      badge((md.ecc === 'rlnc' ? 'packets ' : 'copies ') + md.reps),
      badge('type ' + md.type), badge('payload ' + md.messageBytes + 'B')];
    // Only worth a badge when it actually happened — a badge saying "none" is noise.
    if (md.compression && md.compression !== 'none') items.push(badge(md.compression + ' ' + md.messageBytes + '\u2192' + md.payloadBytes + 'B'));
    if (md.encrypted) items.push(badge(md.encryption));
    if (md.issues && md.issues.length) items.push(badge(md.issues.join(' '), 'bw_warning'));
    bw.DOM('#encMeta', { t: 'div', a: { class: 'metawrap' }, c: items });
  }
  // detailed, expandable stats (chars, encoded chars, ratios, capacity, method, …)
  function statRow(k, v) { return { t: 'tr', c: [{ t: 'td', a: { style: bw.s({ opacity: '.65', paddingRight: '18px', whiteSpace: 'nowrap' }) }, c: k }, { t: 'td', a: { style: bw.s({ fontFamily: 'ui-monospace,Menlo,monospace', textAlign: 'right' }) }, c: v }] }; }
  function renderStats() {
    var md = st.meta; if (!md) return;
    var chans = md.channels || {};
    var coverN = st.cover.length, wmN = st.wm ? st.wm.length : 0, added = wmN - coverN;
    var cap = md.capacityBits || 0, frameBits = md.frameBits || 0;
    var util = cap ? Math.round(1000 * frameBits / cap) / 10 : 0;      // one copy uses this % of capacity
    var bpc = coverN ? Math.round(100 * cap / coverN) / 100 : 0;        // carrier bits per cover char
    var edited = st.wm !== st._encoded;
    var chStr = Object.keys(chans).map(function (id) { return id + ' ' + chans[id].sites + '×' + (chans[id].capacityBits) + 'b'; }).join(', ') || '—';
    var rows = [
      statRow('method', METHODS[st.method].label.split(' — ')[0]),
      statRow('carriers', (md.classes || []).join(' + ')),
      statRow('ecc', md.ecc + (md.ecc === 'rlnc' ? ' (GF(256) fountain)' : ' (repetition + majority)')),
      statRow('scramble key', st.key ? 'set — keyed interleave + whitening' : 'none'),
      statRow('cover chars', String(coverN)),
      statRow('watermarked chars', wmN + (added ? '  (Δ ' + (added > 0 ? '+' : '') + added + ')' : '  (unchanged length)') + (edited ? '  · edited' : '')),
      statRow('payload type', md.type + (md.typeCode !== undefined ? '  (code ' + md.typeCode + ')' : '')),
      statRow('payload', md.messageBytes + ' B given' +
        (md.payloadBytes !== md.messageBytes ? ', ' + md.payloadBytes + ' B stored' : '') +
        '  (packet ' + md.frameBytes + ' B = ' + frameBits + ' bits)'),
      statRow('compression', md.compression + (md.compression !== 'none' && md.messageBytes
        ? '  (' + Math.round(100 - 100 * md.payloadBytes / md.messageBytes) + '% smaller)' : '')),
      statRow('encryption', md.encryption),
      statRow('checksum', md.checksum + '  (' + md.checksumBits + ' bits)'),
      statRow('packet header', md.headerBits + ' bits' + (md.padBits ? ' + ' + md.padBits + ' pad' : '') +
        '  (wire v' + md.wireVersion + ')'),
      statRow('capacity (strongest)', cap + ' bits'),
      statRow('carrier bits / cover char', String(bpc)),
      statRow(md.ecc === 'rlnc' ? 'packets emitted' : 'copies', String(md.reps)),
      statRow('one copy uses', util + '% of capacity'),
      statRow('channels (sites × cap)', chStr)
    ];
    var det = detectability(st.wm || '');
    rows.push({ t: 'tr', c: [
      { t: 'td', a: { style: bw.s({ opacity: '.65', paddingRight: '18px', whiteSpace: 'nowrap' }) }, c: 'detectability' },
      { t: 'td', a: { style: bw.s({ textAlign: 'right' }) }, c: [badge(det.label + ' · ' + det.pct + '%', det.variant)] }
    ] });
    rows.push(statRow('', { t: 'span', a: { style: bw.s({ fontSize: '12px', opacity: '.7', fontFamily: 'inherit' }) }, c: det.detail }));
    if (md.issues && md.issues.length) rows.push(statRow('notes', md.issues.join(' ')));
    bw.DOM('#statsPanel', { t: 'details', a: { style: bw.s({ marginTop: '14px', border: '1px solid ' + p.light.border, borderRadius: '8px', padding: '8px 12px' }) }, c: [
      { t: 'summary', a: { style: bw.s({ cursor: 'pointer', fontWeight: '600', fontSize: '13px' }) }, c: 'Stats & capacity' },
      { t: 'table', a: { style: bw.s({ marginTop: '8px', fontSize: '13px', width: '100%' }) }, c: { t: 'tbody', c: rows } }
    ] });
  }
  // watermarked text: editable textarea by default; highlighted read-only when "show carriers" is on
  function updateMarker() {
    if (st.showCarriers) {
      bw.DOM('#markerView', { t: 'div', a: { class: 'spab-view' }, c: bw.raw(markerHTML(st.wm)) });
    } else {
      bw.DOM('#markerView', { t: 'textarea', a: { class: 'bw_bccl_form_control spab-view', spellcheck: 'false', rows: 14,
        oninput: function (e) { st.wm = e.target.value; runDecode(); renderStats(); } }, c: st.wm || '' });
    }
  }
  function runDecode() {
    var d = SPAB.decode(applyAttacks(st.wm), st.params), md = d.metadata, match = d.message !== null && d.message === st.msg;
    var items = [badge(md.status.toUpperCase(), statusVariant(md.status)),
      { t: 'span', a: { class: 'bw_badge', style: bw.s({ fontFamily: 'ui-monospace,Menlo,monospace' }) }, c: d.message === null ? '—' : d.message },
      badge('match ' + (match ? '✓' : '✗')), badge('confidence ' + Math.round((md.confidence || 0) * 100) + '%')];
    if (md.channel) items.push(badge('via ' + md.channel));
    if (md.packets !== undefined) items.push(badge('packets ' + md.packets));
    bw.DOM('#decResult', { t: 'div', a: { class: 'metawrap' }, c: items });
  }
  function renderAttacks() {
    bw.DOM('#attackRow', { t: 'div', a: { class: 'chipwrap' }, c: Object.keys(A).map(function (k) {
      return bw.makeButton({ text: A[k].label, size: 'sm', variant: st.active[k] ? 'secondary' : 'light', onclick: function () { st.active[k] = !st.active[k]; renderAttacks(); renderSliders(); runDecode(); } });
    }) });
  }
  function renderSliders() {
    var rows = Object.keys(A).filter(function (k) { return A[k].p !== undefined && st.active[k]; }).map(function (k) {
      return { t: 'div', a: { style: bw.s({ display: 'flex', alignItems: 'center', gap: '10px', marginTop: '8px' }) }, c: [
        { t: 'label', a: { style: bw.s({ minWidth: '130px', color: p.dark.base, fontSize: '13px' }) }, c: A[k].label },
        { t: 'input', a: { type: 'range', min: '0', max: '100', value: String(Math.round(A[k].p * 100)), style: bw.s({ flex: '1' }), oninput: function (e) { A[k].p = (+e.target.value) / 100; runDecode(); } } }
      ] };
    });
    bw.DOM('#sliderRow', { t: 'div', c: rows });
  }
  function doEncode() {
    st.params = withKey(params());
    var res = SPAB.encode(st.cover, st.msg, st.params);
    st.wm = res.text; st._encoded = res.text; st.meta = res.metadata;
    updateMeta(res.metadata); updateMarker(); renderStats(); runDecode();
  }
  function renderCarrierRow() {
    var body = st.method === 'sparse'
      ? { t: 'div', c: [
          checkbox('whitespace', st.cls.ws, function (e) { st.cls.ws = e.target.checked; doEncode(); }),
          checkbox('apostrophe', st.cls.apos, function (e) { st.cls.apos = e.target.checked; doEncode(); }),
          checkbox('hyphen', st.cls.hyphen, function (e) { st.cls.hyphen = e.target.checked; doEncode(); })
        ] }
      : { t: 'div', a: { style: bw.s({ fontSize: '13px', opacity: '.7' }) }, c: st.method === 'zwsp'
          ? 'Zero-width mode uses a single inserted carrier (2 bits/char). Length grows; visible in a hex view.'
          : 'Dense-whitespace mode uses 8 space variants (3 bits/gap). Length preserved.' };
    bw.DOM('#carrierRow', body);
  }
  function initTest() { renderAttacks(); renderCarrierRow(); doEncode(); }

  // makeCheckbox wires the label to the input by id, so clicking the text toggles
  // it. Each needs a unique id; a counter is enough for a single page.
  // Attach an event handler to a component that exposes no prop for it
  // (makeTextarea/makeSelect take no oninput/onchange). Returns the same node.
  function control(node, evt, fn) { node.a = node.a || {}; node.a[evt] = fn; return node; }

  var _cbId = 0;
  function checkbox(label, checked, onchange) {
    _cbId += 1;
    var box = bw.makeCheckbox({ label: label, checked: checked, id: 'spab-cb-' + _cbId });
    // makeCheckbox has no onchange prop, so attach it to the input child it built.
    box.c[0].a.onchange = onchange;
    return { t: 'div', a: { style: bw.s({ display: 'inline-block', marginRight: '16px' }) }, c: box };
  }

  // makeFormGroup renders the label as a block above its control. The old
  // hand-rolled version emitted an inline <label> next to the input, which is why
  // "Cover text" and "Message" sat on top of their own fields.
  function field(label, control) {
    return bw.makeFormGroup({ label: label, input: control });
  }

  // ================= PLAYGROUND =================
  //
  // Same instrument as before, laid out as a numbered flow: the two halves of a
  // round trip side by side, then what you do to the text, then what came back.
  function testView() {
    return { t: 'div', a: { id: 'testroot' }, o: { mounted: function () { setTimeout(initTest, 0); } }, c: [
      S({
        eyebrow: 'Live',
        title: 'Playground',
        lede: 'Encode a message, choose carriers and ECC, then attack the text and watch it decode. This runs the real library in your browser — nothing is sent anywhere.',
        content: { t: 'div', a: { class: 'grid2' }, c: [

          bw.makeCard({ title: '1 · Encode', shadow: 'sm', content: { t: 'div', c: [
            field('Cover text', control(bw.makeTextarea({ rows: 6, value: st.cover }), 'oninput', function (e) { st.cover = e.target.value; })),
            field('Message', bw.makeInput({ type: 'text', value: st.msg, oninput: function (e) { st.msg = e.target.value; } })),
            field('Method', control(bw.makeSelect({ options: Object.keys(METHODS).map(function (m) { return { value: m, text: METHODS[m].label }; }) }),
              'onchange', function (e) { st.method = e.target.value; renderCarrierRow(); doEncode(); })),
            { t: 'div', a: { class: 'grid3', style: bw.s({ gap: '14px', alignItems: 'flex-end' }) }, c: [
              field('Carriers', { t: 'div', a: { id: 'carrierRow' } }),
              field('ECC', control(bw.makeSelect({ options: [{ value: 'repetition', text: 'repetition' }, { value: 'rlnc', text: 'RLNC fountain' }] }),
                'onchange', function (e) { st.ecc = e.target.value; doEncode(); })),
              field('Scramble key (optional)', bw.makeInput({ type: 'text', placeholder: 'none', value: st.key, oninput: function (e) { st.key = e.target.value; doEncode(); } })),
              field('Oversized payloads', { t: 'div', c: [
                checkbox('auto-grow with zero-width', st.autoGrow, function (e) { st.autoGrow = e.target.checked; doEncode(); }),
                { t: 'div', a: { style: bw.s({ fontSize: '12.5px', opacity: '.72', marginTop: '2px' }) },
                  c: 'Adds invisible characters when the payload will not fit. The words are unchanged, but the byte length grows and the mark shows in a hex dump. Allowed — not recommended for a mark meant to go unnoticed.' }
              ] })
            ] },
            { t: 'div', a: { style: bw.s({ marginTop: '14px' }) }, c: bw.makeButton({ text: 'Encode ▶', variant: 'primary', onclick: doEncode }) },
            { t: 'div', a: { id: 'encMeta', style: bw.s({ marginTop: '16px' }) } },
            { t: 'div', a: { id: 'statsPanel' } }
          ] } }),

          bw.makeCard({ title: '2 · Watermarked text', shadow: 'sm', content: { t: 'div', c: [
            { t: 'div', a: { style: bw.s({ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '4px', marginBottom: '10px' }) }, c: [
              checkbox('show carriers', st.showCarriers, function (e) { st.showCarriers = e.target.checked; updateMarker(); }),
              { t: 'span', a: { style: bw.s({ fontSize: '12.5px', opacity: '.6' }) }, c: 'edit the text below — decode survives your changes' }
            ] },
            { t: 'div', a: { id: 'markerView' } },
            { t: 'div', a: { style: bw.s({ marginTop: '12px', display: 'flex', gap: '8px' }) }, c: [
              bw.makeButton({ text: 'Copy', variant: 'outline-secondary', size: 'sm', onclick: function () { if (st.wm && navigator.clipboard) navigator.clipboard.writeText(st.wm); } }),
              bw.makeButton({ text: 'Reset to encoded', variant: 'light', size: 'sm', onclick: function () { st.wm = st._encoded; updateMarker(); renderStats(); runDecode(); } })
            ] }
          ] } })
        ] }
      }),

      S({
        tight: true,
        content: { t: 'div', a: { class: 'grid2' }, c: [
          bw.makeCard({ title: '3 · Channel attacks', shadow: 'sm', content: { t: 'div', c: [
            { t: 'p', a: { style: bw.s({ opacity: '.7', fontSize: '13.5px', marginTop: '0' }) }, c: 'Applied before decoding. Click to toggle; sliders set intensity.' },
            { t: 'div', a: { id: 'attackRow' } },
            { t: 'div', a: { id: 'sliderRow' } }
          ] } }),
          bw.makeCard({ title: '4 · Decode', shadow: 'sm', content: { t: 'div', a: { id: 'decResult' } } })
        ] }
      })
    ] };
  }


  // ================= FRONT-PAGE TRY IT =================
  //
  // The simple version, on purpose: your text, your secret, a copyable result, and
  // recovery in the other direction. No carriers, no ECC choice, no attack sliders
  // — that is what /test is for. Anything that would make a first-time visitor
  // choose something before seeing it work has been left out.
  // autoGrow on: the front page should just work whatever someone types. A secret
  // too large for the passage grows the text with zero-width characters rather
  // than failing — allowed, and shown honestly in the note underneath. The
  // Playground exposes the flag so the trade-off can be seen and turned off.
  var TRY_PARAMS = { classes: ['ws', 'apos', 'hyphen'], ecc: 'repetition', autoGrow: true };

  // A document of the kind someone would actually mark, long enough to carry three
  // copies of the payload. A passage that fits exactly one copy cannot survive an
  // edit however good the decoder is, and a demo that invites editing must not be
  // built on one.
  var TRY_SAMPLE = 'The board reviewed the quarterly figures on Tuesday and asked for a re-forecast ' +
    'before the end of the month. Operating costs are down year-over-year, though the well-documented ' +
    'delays on the Hartley contract haven\'t yet worked through the numbers. Finance will circulate a ' +
    'revised model on Friday; it isn\'t final, and the committee\'s own estimate may differ once the ' +
    'half-year audit closes. Please don\'t forward this outside the working group. Each recipient\'s ' +
    'copy carries its own identifier, so if a draft turns up somewhere it shouldn\'t, we will know ' +
    'which one it came from - and it won\'t be a matter of guesswork. Nothing in the text has been ' +
    'altered to do that: the words, the punctuation and the line breaks are exactly as written, and ' +
    'a reader comparing two copies side by side would not find a single character out of place.';

  // Two stages, left to right: original + secret in, watermarked + recovered out.
  //
  // The watermarked box is EDITABLE and is the same field recovery reads from.
  // That is deliberate: surviving ordinary editing is the whole claim, so the
  // artifact a visitor is invited to mangle should be the one that gets decoded.
  // It also removes a step that existed only to serve the old layout — copying
  // the result out of one card and into a separate paste box.
  var tr = { cover: TRY_SAMPLE, secret: 'acme-42', marked: '', note: null, kind: 'info', found: undefined };

  // Light counts under each box. Chars and words being identical on both sides is
  // the length-preservation claim, shown rather than asserted; the site count is
  // what actually determines how much a passage can hold.
  function statsLine(text, opts) {
    var words = text.trim() ? text.trim().split(/\s+/).length : 0;
    var nonSpace = text.replace(/\s/g, '').length;
    var parts = [
      text.length + ' chars',
      words + ' words',
      nonSpace + ' non-space'
    ];
    if (opts && opts.sites !== undefined) parts.push(opts.sites + ' carrier sites');
    return { t: 'p', a: { class: 'stats' }, c: parts.join('  ·  ') };
  }

  function paintStats() {
    var sites = null;
    try { sites = SPAB.getSites(tr.cover, TRY_PARAMS).length; } catch (e) { sites = undefined; }
    bw.DOM('#statsIn', statsLine(tr.cover, { sites: sites }));
    bw.DOM('#statsOut', tr.marked ? statsLine(tr.marked) : { t: 'span' });
  }

  function paintTryNote() {
    bw.DOM('#tryNote', tr.note ? bw.makeAlert({ variant: tr.kind, content: bw.raw(tr.note) }) : { t: 'span' });
  }

  function paintMarked() {
    bw.DOM('#markedBox', control(bw.makeTextarea({
      rows: 9,
      value: tr.marked,
      placeholder: 'The watermarked copy appears here. Edit it, or paste other text, then recover.'
    }), 'oninput', function (e) { tr.marked = e.target.value; paintStats(); }));
  }

  function paintFound() {
    var body;
    if (tr.found === undefined) {
      body = { t: 'span', a: { class: 'muted' }, c: 'Press Recover to read it back.' };
    } else if (tr.found) {
      body = { t: 'span', a: { class: 'hit' }, c: [
        bw.makeBadge({ text: 'found', variant: 'success' }),
        { t: 'b', c: tr.found }
      ] };
    } else {
      body = { t: 'span', a: { class: 'hit' }, c: [
        bw.makeBadge({ text: 'nothing', variant: 'light' }),
        { t: 'span', a: { class: 'muted' }, c: 'No watermark in that text — or it was stripped.' }
      ] };
    }
    bw.DOM('#recOut', { t: 'div', a: { class: 'readout' }, c: body });
  }

  function doWatermark() {
    var res;
    try {
      res = SPAB.encode(tr.cover, tr.secret, TRY_PARAMS);
    } catch (e) {
      tr.marked = ''; tr.note = 'Could not watermark this text: ' + bw.escapeHTML(e.message); tr.kind = 'danger';
      paintMarked(); paintTryNote(); return;
    }
    var md = res.metadata;
    tr.marked = res.text;
    tr.found = undefined;   // a new mark invalidates the previous readout

    // Verify by decoding what was just produced rather than trusting the encode:
    // a passage can be too short to hold the secret, and spab reports that in
    // metadata instead of failing, so the honest thing is to check and explain.
    var back = SPAB.decode(res.text, TRY_PARAMS);
    if (back.message === tr.secret) {
      tr.kind = 'success';
      var grew = res.text.length - tr.cover.length;
      tr.note = '<b>Hidden.</b> ' + md.messageBytes + ' bytes carried ' + md.reps +
        '\u00d7 over ' + md.slots + ' sites.' +
        (grew > 0 ? ' The secret was larger than this passage could hold, so <b>' + grew +
          ' invisible characters</b> were added — the words are unchanged, but the text is now ' +
          'longer in bytes and the mark is obvious to anyone reading the raw file.' : '');
    } else {
      tr.kind = 'warning';
      tr.note = '<b>This passage is too short for that secret.</b> It needs ' + md.frameBits +
        ' bits and the best channel holds ' + md.capacityBits +
        '. Add a sentence or two, or use a shorter secret.';
    }
    paintMarked(); paintFound(); paintTryNote(); paintStats();
  }

  function doRecover() {
    var d;
    try {
      d = SPAB.decode(tr.marked, TRY_PARAMS);
    } catch (e) {
      d = { message: null };
    }
    tr.found = d.message;
    paintFound();
  }

  // ================= HOW IT WORKS =================
  function howView() {
    // The worked example is COMPUTED, not written. Every number below comes from
    // running the codec in the reader's browser, so the page cannot drift from the
    // implementation the way prose does.
    var demoCover = 'The board reviewed the quarterly figures on Tuesday and asked for a ' +
      're-forecast before the end of the month. Operating costs are down year-over-year.';
    var demoMsg = 'acme-42';
    var demoEnc = SPAB.encode(demoCover, demoMsg, {});
    var demoMeta = demoEnc.metadata;
    var demoDec = SPAB.decode(demoEnc.text, {});
    var sites = SPAB.getSites(demoCover, {});
    var hist = SPAB.histogram(demoEnc.text);

    // Render the first N carrier sites of the marked text, showing which variant
    // each gap became. This is the whole mechanism in one strip.
    function siteStrip(text, n) {
      var idx = SPAB.CLASS_DEFS.ws.detect(text).slice(0, n);
      var names = ['U+0020', 'U+2006', 'U+2009', 'U+200A'];
      return { t: 'div', a: { style: bw.s({ display: 'flex', flexWrap: 'wrap', gap: '6px', marginTop: '10px' }) },
        c: idx.map(function (i) {
          var v = SPAB.CLASS_DEFS.ws.read(text, i);
          var word = text.slice(Math.max(0, text.lastIndexOf(' ', i - 1) + 1), i);
          return { t: 'div', a: { style: bw.s({ border: '1px solid ' + p.light.border, borderRadius: '6px',
            padding: '4px 7px', fontSize: '11px', fontFamily: 'ui-monospace,Menlo,monospace',
            background: v ? p.tertiary.light : 'transparent' }) },
            c: [{ t: 'div', a: { style: bw.s({ opacity: '.6' }) }, c: 'after "' + word + '"' },
                { t: 'div', a: { style: bw.s({ fontWeight: '600' }) }, c: names[v] + '  = ' + v.toString(2).padStart(2, '0') }] };
        }) };
    }

    function step(n, title, body) {
      return { t: 'div', a: { style: bw.s({ display: 'flex', gap: '14px', marginTop: '20px' }) }, c: [
        { t: 'div', a: { style: bw.s({ flex: '0 0 30px', height: '30px', borderRadius: '50%',
          background: p.primary.base, color: '#fff', display: 'flex', alignItems: 'center',
          justifyContent: 'center', fontWeight: '700', fontSize: '14px' }) }, c: String(n) },
        { t: 'div', a: { style: bw.s({ flex: '1 1 auto', minWidth: '0' }) },
          c: [{ t: 'h3', a: { style: bw.s({ margin: '2px 0 6px' }) }, c: title }].concat(body) } ] };
    }
    function pre(text) {
      return { t: 'pre', a: { style: bw.s({ background: p.light.surface, border: '1px solid ' + p.light.border,
        borderRadius: '8px', padding: '10px 12px', fontSize: '12.5px', overflowX: 'auto', margin: '8px 0' }) },
        c: [{ t: 'code', c: text }] };
    }
    var P = function (html) { return { t: 'p', a: { class: 'prose' }, c: bw.raw(html) }; };

    return { t: 'div', c: [
      S({
        eyebrow: 'Reference',
        title: 'How spab works',
        lede: 'A walk through what happens to a message between calling encode and reading it back, ' +
              'in the order it happens. The numbers below are computed in your browser from the ' +
              'example shown, not written into the page.',
        content: { t: 'div', c: [

          P('Text contains choices a reader never notices. Which of several identical-looking space ' +
            'characters sits between two words. Whether an apostrophe is straight or curly. Whether a ' +
            'hyphen is <code>U+002D</code> or <code>U+2010</code>. spab spends those choices to carry bits, ' +
            'and leaves everything a reader can see alone.'),

          P('Take this sentence as the cover text:'),
          pre(demoCover),
          P('It has <b>' + sites.length + ' carrier sites</b> — positions where a character can be swapped for ' +
            'an equivalent one. Hiding <code>"' + demoMsg + '"</code> in it does this to the first few of them:'),
          siteStrip(demoEnc.text, 10),
          P('Each whitespace site holds one of four space characters, so <b>2 bits</b> each. The marked text ' +
            'is <b>' + demoEnc.text.length + ' characters</b>, the same as the original ' + demoCover.length +
            ' — every change is a substitution, never an insertion.'),

          { t: 'h3', a: { style: bw.s({ marginTop: '30px' }) }, c: 'Encoding, step by step' },

          step(1, 'Work out what the payload is', [
            P('The message is inspected and given a <b>type</b>: <code>string</code>, <code>json</code>, ' +
              '<code>uuid</code>, <code>sha256</code>, <code>ser8</code> (an 8-byte tag), or raw <code>bytes</code>. ' +
              'This is not cosmetic. A fixed-size type carries no length field at all, and it stores compactly — ' +
              'a UUID travels as 16 raw bytes rather than 36 characters.'),
            P('Here the type is <code>' + demoMeta.type + '</code> and the payload is ' +
              demoMeta.messageBytes + ' bytes.')
          ]),

          step(2, 'Compress it, but only if that helps', [
            P('Compression is attempted on every payload and kept <b>only if the result is smaller</b>. ' +
              'That condition matters more than it sounds: payloads here are usually 8&ndash;200 bytes, and every ' +
              'general-purpose compressor makes inputs that small <i>bigger</i>. Compressing unconditionally ' +
              'would inflate the most common case.'),
            P('For this payload: <code>' + demoMeta.compression + '</code>' +
              (demoMeta.compression === 'none' ? ' — seven bytes of text has nothing to compress.' : '.'))
          ]),

          step(3, 'Encrypt it, if you asked for that', [
            P('With <code>params.encKey</code> the payload is encrypted with AES-256-GCM and the content becomes ' +
              '<code>nonce &#8214; ciphertext &#8214; tag</code>, costing 28 bytes. Without a key nothing happens here.'),
            P('Encryption and the optional <code>params.key</code> scramble are different things. Encryption hides ' +
              'the <i>contents</i>. The scramble rearranges <i>where the symbols go</i>, which raises the cost of ' +
              'stripping the mark but is not confidentiality. They compose.')
          ]),

          step(4, 'Wrap it in a packet', [
            P('A 17-bit header, then the checksum, then the content:'),
            pre('[ version:3 | type:5 | comp:3 | enc:3 | cksum:3 ]   17-bit fixed header\n' +
                '[ extension bytes ]              only when a field runs out of values\n' +
                '[ length varint ]                only when the type does not imply it\n' +
                '[ checksum, 8 << cksum bits ]    before the content, deliberately\n' +
                '[ content ][ pad to a byte ]'),
            P('Two things are unusual and both are deliberate. There is <b>no magic number</b> — the header\'s own ' +
              'plausibility plus the checksum is what tells the decoder it has found a packet. And the ' +
              '<b>checksum comes before the content</b>: the commonest damage is losing the end of a document, and ' +
              'a checksum at the end dies with the data it was protecting. In front, a surviving header still says ' +
              'what the missing bytes should have hashed to.'),
            P('This packet: <b>' + demoMeta.headerBits + ' header bits</b> + ' + (demoMeta.payloadBytes * 8) +
              ' content bits, checksum <code>' + demoMeta.checksum + '</code>, ' +
              demoMeta.frameBytes + ' bytes in total.')
          ]),

          step(5, 'Add error correction', [
            P('The packet is written <b>' + demoMeta.reps + ' times</b> here, as many as the text will hold, and the ' +
              'decoder takes a per-bit majority vote. That is the default. The alternative, <code>ecc: "rlnc"</code>, ' +
              'is a fountain code: it emits self-checking 32-bit packets that can be pooled from whichever carrier ' +
              'channels survived.'),
            P('Which is better depends on the damage. Majority voting corrects <i>bit errors</i>, because a wrong bit ' +
              'is outvoted. The fountain handles <i>lost pieces</i>, because a small packet fits in a fragment that ' +
              'a whole frame does not. On a document cut into many pieces the fountain recovers roughly five times ' +
              'as often; on scattered character damage majority voting wins.'),
            P('<b>Redundancy is the variable that matters.</b> Recovery is around 29% at one copy and 57% at five to ' +
              'eight, for the same carriers and the same damage. More text buys copies, and copies buy survival.')
          ]),

          step(6, 'Pack the bits into carrier symbols', [
            P('Carriers have different alphabet sizes — whitespace has 4 variants, apostrophes and hyphens 2 — so bits ' +
              'are packed by mixed-radix conversion in bounded blocks rather than one site at a time. That recovers ' +
              'the fractional bits a non-power-of-two alphabet would otherwise waste.'),
            P('The cost of blocking is worth knowing: every site in a block affects every bit of that block, so one ' +
              'damaged character can cost up to 32 bits rather than 2.')
          ]),

          step(7, 'Write it into the text', [
            P('Each enabled carrier class is an <b>independent channel carrying the whole payload</b>. That is not ' +
              'extra capacity — what decides whether a payload fits is the largest single channel, not the sum. ' +
              'It is redundancy against different failures.'),
            P('The default set is whitespace plus apostrophe and hyphen, chosen because they break on different ' +
              'edits. NFKC normalisation, which databases and search systems apply routinely, flattens every ' +
              'whitespace variant and leaves the confusables intact. A word processor\'s smart-quote autocorrect ' +
              'does the opposite. Neither edit takes both.'),
            { t: 'div', a: { style: bw.s({ marginTop: '10px' }) }, c: [tt(
              ['carrier', 'variants', 'bits/site', 'sites here', 'survives NFKC'],
              [['whitespace', 'space / six-per-em / thin / hair', '2', String(SPAB.CLASS_DEFS.ws.detect(demoCover).length),
                bw.raw('<b style="color:' + p.danger.base + '">no</b>')],
               ['apostrophe', bw.raw("straight <code>'</code> / curly <code>&#8217;</code>"), '1',
                String(SPAB.CLASS_DEFS.apos.detect(demoCover).length),
                bw.raw('<b style="color:' + p.success.base + '">yes</b>')],
               ['hyphen', bw.raw('<code>-</code> / <code>&#8208;</code>'), '1',
                String(SPAB.CLASS_DEFS.hyphen.detect(demoCover).length),
                bw.raw('<b style="color:' + p.success.base + '">yes</b>')]])] }
          ]),

          { t: 'h3', a: { style: bw.s({ marginTop: '34px' }) }, c: 'Decoding, and the part that is hard' },

          P('Reading back is the same steps in reverse: read each site, unpack the blocks into bits, vote across the ' +
            'copies, verify the checksum, then decrypt and decompress. On this example that returns ' +
            '<code>"' + demoDec.message + '"</code> with status <code>' + demoDec.metadata.status + '</code>.'),

          P('The difficulty is <b>synchronisation</b>. Delete one word and every carrier after it shifts by one ' +
            'position, so the block grid is cut in the wrong place and everything past the edit decodes to noise. ' +
            'Redundancy does not help, because every copy shifts identically.'),

          pre('sent:      A B C D E F G\n' +
              'received:  A B   D E F G      <- C deleted\n' +
              '                 ^ everything from here is framed one position early'),

          P('Two mechanisms handle it. The decoder re-cuts the block grid at each of <b>32 offsets</b> and tries again, ' +
            'so a uniform shift becomes "try phase 3 instead of phase 0". And because each packet carries its own ' +
            'checksum and length, one intact copy can be recognised <b>anywhere</b> in the stream without help from ' +
            'its neighbours.'),

          { t: 'h3', a: { style: bw.s({ marginTop: '34px' }) }, c: 'What destroys a mark' },

          P('Stated plainly, because the failure cases are the useful part of knowing how something works.'),
          { t: 'div', c: [tt(['edit', 'effect'], [
            ['Normalising whitespace', 'Destroys the whitespace channel completely. Pasting into a plain-text field, ' +
              'a search index, or PDF text extraction all do this. The confusable channels survive, but they are small.'],
            ['Reflowing or re-wrapping', 'Same — the whitespace channel is gone.'],
            ['Retyping the text', 'Removes everything. No character-level scheme survives a rewrite.'],
            ['Stripping invisible characters', 'Removes a zero-width mark entirely; leaves a substitution mark untouched.'],
            ['Deliberate removal', 'Anyone who knows the carrier set can strip it. spab does not claim otherwise.'],
            ['Editing, quoting, excerpting', 'Survivable, and this is what the redundancy and resynchronisation are for.']
          ])] },

          P('One property is treated as more important than recovery: a damaged mark must never decode to a ' +
            '<i>different</i> payload. Losing a watermark is a non-answer, which a caller can handle. Returning ' +
            'someone else\'s identifier is a false provenance claim, which they cannot. The test suite forbids the ' +
            'second and merely measures the first.'),

          P('There is also a visual tell worth knowing. Thin, hair and six-per-em spaces are <i>equivalent</i> to a ' +
            'plain space, not <i>identical</i> to it — they are narrower. In a proportional font a marked paragraph ' +
            'sets about 3% narrower than its source: invisible alone, occasionally noticeable side by side. ' +
            'Monospace rendering removes the difference, and the confusable carriers have no such tell.'),

          P('Measured behaviour under 27 models of real-world damage is on the ' +
            '<a href="#/robustness">robustness page</a>, and you can run any of this yourself in the ' +
            '<a href="#/test">playground</a>.')
        ] }
      })
    ] };
  }

  // ---------------------------------------------------------------- robustness
  //

    // be the easiest way to make this page dishonest.

    // ---- the main table: one row per channel model ----

      .sort(function (a, b) {
        var ka = (cat[a.model] || {}).kind || 'zz', kb = (cat[b.model] || {}).kind || 'zz';
        var order = { control: 0, channel: 1, attack: 2 };

      });

    // SORTING NOTE. bw.makeTable's own sort cannot be used with these columns.
    // Its initial render accepts a DOM spec from render(), but its re-render path
    // does `td.textContent = render(...)`, so a spec object becomes the string
    // "[object Object]" the moment a header is clicked. render() has to return a

    // colouring and the per-cell trial counts.

      { t: 'div', a: { style: bw.s({ overflowX: 'auto' }) }, c: [bw.makeTable({
